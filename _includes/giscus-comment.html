{% if site.giscus.repository and site.giscus.hostname %}

<section class="post-comments" aria-label="Comments">
  <script src="https://giscus.app/client.js"
          data-repo="{{ site.giscus.repository }}"
          data-repo-id="{{ site.giscus['repository-id'] }}"
          data-category="{{ site.giscus.category }}"
          data-category-id="{{ site.giscus['category-id'] }}"
          data-mapping="{{ site.giscus.mapping }}"
          data-strict="0"
          data-reactions-enabled="{{ site.giscus['reactions-enabled'] }}"
          data-emit-metadata="{{ site.giscus['emit-metadata'] }}"
          data-input-position="bottom"
          data-theme="preferred_color_scheme"
          data-lang="en"
          crossorigin="anonymous"
          async>
  </script>
  <script>
    (function () {
      var origin = "https://giscus.app";
      var setGiscusTheme = function () {
        var iframe = document.querySelector("iframe.giscus-frame");
        if (!iframe || !iframe.contentWindow) {
          return;
        }
        var theme = document.body.classList.contains("dark-mode") ? "dark" : "light";
        iframe.contentWindow.postMessage({ giscus: { setConfig: { theme: theme } } }, origin);
      };
      window.addEventListener("message", function (event) {
        if (event.origin !== origin || !event.data || !event.data.giscus) {
          return;
        }
        setGiscusTheme();
      });
      document.querySelectorAll(".switch input").forEach(function (input) {
        input.addEventListener("change", setGiscusTheme);
      });
    })();
  </script>
</section>

{% endif %}
