{% if site.post_search %}

<div id="beautifuljekyll-search-overlay">
  <div class="site-search-panel">
    <div class="site-search-row">
      <input type="text" id="nav-search-input" placeholder="Search posts, projects, and pages">
      <button type="button" id="nav-search-exit" title="Exit search" aria-label="Close search">✕</button>
    </div>
    <ul id="search-results-container"></ul>
  </div>

  <script src="https://unpkg.com/simple-jekyll-search@latest/dest/simple-jekyll-search.min.js"></script>
  <script>
    SimpleJekyllSearch({
      searchInput: document.getElementById("nav-search-input"),
      resultsContainer: document.getElementById("search-results-container"),
      json: "{{ '/search.json' | relative_url }}",
      searchResultTemplate: '<li><a href="{url}"><span>{title}</span><small>{category}</small></a></li>',
      noResultsText: "No results found",
      limit: 20
    });
  </script>
</div>

{% endif %}
